name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
        working-directory: SpikServer/SpikServer
      - run: dotnet build --no-restore -c Release
        working-directory: SpikServer/SpikServer

  build-admin-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json
      - run: npm ci
        working-directory: admin-panel
      - run: npm run build
        working-directory: admin-panel

  lint-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        working-directory: telegram-bot
      - run: python -m py_compile bot.py
        working-directory: telegram-bot

  docker:
    runs-on: ubuntu-latest
    needs: [build-server, build-admin-panel]
    steps:
      - uses: actions/checkout@v4
      # Образ сервера собирает панель сам, поэтому проверяем сборку целиком.
      - run: docker build -f SpikServer/Dockerfile -t aethershell-server .
      - run: docker build -t aethershell-bot ./telegram-bot
